[project]
name = "steer"
version = "0.1.0"
description = "MultiWOZ contrastive response pairs for activation-steering experiments"
readme = "README.md"
authors = [
    { name = "arya", email = "arya.lavasani@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=4,<5",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    # Intel Mac PyTorch 2.2 wheels use the NumPy 1.x ABI.
    # Use the Arrow 21 series with NumPy 1.x on the same platform.
    "pyarrow>=21,<22; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
steer = "steer.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Require wheels for the Intel Mac used for development.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
# Rebuild the installed package when Python source files change.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
